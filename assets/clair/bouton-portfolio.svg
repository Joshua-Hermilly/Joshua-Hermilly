<svg xmlns='http://www.w3.org/2000/svg' width='130' height='44' viewBox='0 0 130 44' role='img' aria-label='Portfolio'>
<style>
.sans{font-family:'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes apparaitre{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ap{animation:apparaitre .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes glisser{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.gl{animation:glisser .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes clignoter{0%,49%{opacity:1}50%,100%{opacity:0}}
.cl{animation:clignoter 1.1s step-end infinite}
@keyframes tracer{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.tr{stroke-dasharray:1;animation:tracer 1.4s cubic-bezier(.6,0,.2,1) both}
@keyframes pulser{0%,100%{opacity:1}50%{opacity:.3}}
.pu{animation:pulser 2.4s ease-in-out infinite}
@keyframes tourner{to{transform:rotate(360deg)}}
.pivot{transform-box:fill-box;transform-origin:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x='1' y='1' width='128' height='42' rx='11' fill='#FFFFFF' stroke='#D9DEE4' stroke-width='1.5'/>
<g transform='translate(18 12)' fill='none' stroke='#D7261C' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='6' width='16' height='11' rx='2.5'/><path d='M7 6 V4.5 Q7 3 8.5 3 H11.5 Q13 3 13 4.5 V6 M2 11 H18'/></g>
<text class='sans' x='78' y='27.5' font-size='15' font-weight='600' fill='#16191D' text-anchor='middle'>Portfolio</text>
</svg>
